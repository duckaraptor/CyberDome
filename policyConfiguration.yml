accessFrequencyMaxRequests: 30
accessFrequencyWindowMinutes: 5
adminThreshold: '0.6'
approverThreshold: '0.9'
highRiskLocations:
- KP
lowRiskLocations:
- SE
mediumRiskLocations:
- KE
periodEndInput: 06:00:00
periodStartInput: 00:00:00
resources:
  logging:
    adminResource: true
    allowedRoles:
    - Administrator
    - Security Viewer
    description: Logging and monitoring (the audit log)
    path: /logging
  pam_approval:
    adminResource: false
    allowedRoles:
    - Approver
    description: Approve privileged access (PAM) requests
    path: /testing
  policy_configuration:
    adminResource: true
    allowedRoles:
    - Administrator
    - Policy Administrator
    description: Change the security policies
    path: /configurePolicies
  resource_1:
    adminResource: false
    allowedRoles:
    - Researcher
    - Administrator
    description: Transaction data (our research database)
    path: /resource-1
  resource_2:
    adminResource: false
    allowedRoles:
    - Administrator
    description: Access tokens (sensitive)
    path: /resource-2
securityViewerThreshold: '0.4'
signInSuccessThreshold: '0.5'
trustWeights:
  accessFrequency: 0.15
  accessTime: 0.1
  accountAge: 0.05
  device: 0.2
  identityStrength: 0.15
  location: 0.15
  loginHistory: 0.2
